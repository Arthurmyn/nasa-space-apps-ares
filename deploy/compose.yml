# Production backend. The root docker-compose.yml is for local development (--reload, vite dev).
# Run by deploy/deploy.sh with --project-directory /srv/ares, so paths below are relative to it.
services:
  backend:
    build:
      context: ./repo
      dockerfile: backend/Dockerfile
    image: ares-backend:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: ./.env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
