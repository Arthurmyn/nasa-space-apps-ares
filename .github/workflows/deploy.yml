# Deploys a commit to the VPS. See deploy/README.md.
# Manual only: run it from the Actions tab ("Run workflow") and pick the branch, usually main.
# Pushes never deploy on their own.
name: Deploy

on:
  workflow_dispatch:

# One deploy at a time: a second run waits for the first instead of cancelling it.
# The server also holds a lock, so deploys never overlap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is restricted on the server: it can only run deploy/ssh-deploy with a commit SHA.
      - name: Deploy ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 "deploy@$VPS_HOST" "$GITHUB_SHA"

      - name: Check the site responds
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in $(seq 1 12); do
            curl -fsS "$SITE_URL/api/v1/health" && exit 0
            sleep 5
          done
          echo "The API did not answer at $SITE_URL/api/v1/health" >&2
          exit 1
