name: 📋 Task
description: A technical task, research, setup, or an ML experiment
title: "[Task]: "
labels: ["type:task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend, ML, Infra, Docs, Pitch / Presentation]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Result (what counts as done)
      value: |
        - [ ]
  - type: input
    id: estimate
    attributes:
      label: Time estimate
      placeholder: "for example, 2h"
