name: ✨ Feature
description: New functionality or an improvement
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend, ML, Infra]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What needs to be done and why
      placeholder: As a user, I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Definition of done
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P0 - blocks the demo", "P1 - needed for the MVP", "P2 - nice to have"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / links / mockups
